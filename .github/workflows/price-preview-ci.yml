name: Pricing Preview Verification

on:
  push:
    branches:
      - preview/grey-blue-white-refresh
      - upgrade/admin-catalogue-content
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Verify price validity and build site
        run: npm run build
