name: Supplier Ownership Verification

on:
  push:
    branches:
      - feature/supplier-ownership-review

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Build and run project verification
        run: npm run build
